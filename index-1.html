    // Stats
    const sg=mk('div',{style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px'});
    const todayNew=STUDENTS.filter(s=>s.joinDate===today).length;
    const todayActive=STUDENTS.filter(s=>s.lastSeen===today&&s.active!==false).length;
    [[active.length,'Total','👥','var(--green)'],[todayNew,'Aaj Joined','🆕','var(--orange)'],[todayActive,'Aaj Active','🟢','var(--cyan)']].forEach(([v,l,ic,col])=>{
      const c2=mk('div',{style:'background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center'});
      c2.innerHTML=`<div style="font-size:18px">${ic}</div><div style="font-weight:900;font-size:20px;color:${col};margin-top:3px">${v}</div><div style="font-size:10px;color:var(--sub)">${l}</div>`;
      sg.appendChild(c2);
    });
    w.appendChild(sg);

    // Add student manually
    const addCard=mk('div',{class:'card',style:'margin-bottom:14px'});
    addCard.innerHTML=`<div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:10px">➕ Student Manually Add Karo</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <input id="add-stu-name" class="inp" placeholder="Naam..." style="padding:9px 11px;font-size:13px">
      <input id="add-stu-phone" class="inp" type="tel" placeholder="Phone (10 digit)..." maxlength="10" style="padding:9px 11px;font-size:13px">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <select id="add-stu-cls" class="inp" style="padding:9px 10px;font-size:12px;flex:1">
        <option value="9">Class 9</option><option value="10" selected>Class 10</option>
      </select>
      <select id="add-stu-brd" class="inp" style="padding:9px 10px;font-size:12px;flex:1">
        <option value="HBSE" selected>HBSE</option><option value="CBSE">CBSE</option>
      </select>
    </div>`;
    const addBtn=mk('button',{class:'btn btn-green btn-sm',style:'width:100%;padding:10px'});addBtn.textContent='➕ Add Student';
    addBtn.onclick=()=>{
      const name=document.getElementById('add-stu-name')?.value?.trim();
      const ph=document.getElementById('add-stu-phone')?.value?.trim();
      const cls2=document.getElementById('add-stu-cls')?.value;
      const brd=document.getElementById('add-stu-brd')?.value;
      if(!name){toast('Naam zaroori hai!','err');return;}
      if(!ph||ph.length!==10||!/^\d+$/.test(ph)){toast('10 digit phone number daalo!','err');return;}
      if(STUDENTS.find(s=>s.phone===ph)){toast('Yeh number already registered hai!','warn');return;}
      const stu={id:'stu_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name,phone:ph,cls:cls2,board:brd,joinDate:new Date().toISOString().split('T')[0],lastSeen:new Date().toISOString().split('T')[0],active:true};
      STUDENTS.push(stu);svStudents();draw();toast(`${name} add ho gaya! ✅`);
    };
    addCard.appendChild(addBtn);w.appendChild(addCard);

    // Search
    const srchWrap=d('margin-bottom:10px');
    const srchInp=mk('input',{class:'inp',placeholder:'Name ya phone se dhundho...',style:'font-size:13px'});
    srchInp.addEventListener('input',()=>{
      const q=srchInp.value.toLowerCase();
      document.querySelectorAll('.stu-row').forEach(row=>{
        const txt=row.dataset.search||'';
        row.style.display=txt.includes(q)?'':'none';
      });
    });
    srchWrap.appendChild(srchInp);w.appendChild(srchWrap);

    // Student list
    if(active.length===0){
      const e=d('text-align:center;padding:30px;background:var(--card2);border-radius:13px;border:1px dashed var(--border);color:var(--sub)');
      e.innerHTML='<div style="font-size:36px">👥</div><div style="font-weight:700;color:var(--text);margin-top:7px">Koi student nahi</div><div style="font-size:12px;margin-top:3px">Jab students login karenge yahan dikhenge</div>';
      w.appendChild(e);
    } else {
      const ll=d('display:flex;flex-direction:column;gap:8px');
      [...active].sort((a,b)=>new Date(b.joinDate||0)-new Date(a.joinDate||0)).forEach(stu=>{
        const isActiveToday=stu.lastSeen===today;
        const row=mk('div',{class:'stu-row',style:'background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 14px'});
        row.dataset.search=`${stu.name} ${stu.phone} ${stu.cls} ${stu.board}`.toLowerCase();
        row.innerHTML=`
        <div style="display:flex;align-items:center;gap:11px">
          <div style="width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;flex-shrink:0">${stu.name[0]?.toUpperCase()||'S'}</div>
          <div style="flex:1;overflow:hidden">
            <div style="font-weight:700;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${stu.name}</div>
            <div style="font-size:11px;color:var(--sub);margin-top:1px">📱 ${stu.phone} • Class ${stu.cls} • ${stu.board}</div>
            <div style="font-size:10px;color:var(--sub);margin-top:1px">Joined: ${fdate(stu.joinDate)} • Last seen: ${isActiveToday?'<span style="color:var(--green);font-weight:700">Aaj</span>':fdate(stu.lastSeen)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
            ${isActiveToday?'<span style="background:var(--green)22;color:var(--green);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700">● Active</span>':''}
            <div style="font-size:9px;color:var(--sub);max-width:80px;word-break:break-all;text-align:right">ID: ${stu.id.slice(-8)}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:9px">
          <button class="stu-access" data-id="${stu.id}" style="flex:1;padding:7px;border-radius:9px;background:var(--acc)15;border:1px solid var(--acc)30;color:var(--acc);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🔒 Manage Access</button>
          <button onclick="removeStudent('${stu.id}')" style="flex:1;padding:7px;border-radius:9px;background:var(--red)15;border:1px solid var(--red)30;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🚫 Remove</button>
        </div>`;
        row.querySelector('.stu-access').onclick=()=>openStudentAccessModal(stu.id);
        ll.appendChild(row);
      });
      w.appendChild(ll);
    }

    // Removed students
    if(removed.length>0){
      const rt=d('margin-top:16px');
      rt.innerHTML=`<div style="font-weight:700;font-size:13px;color:var(--sub);margin-bottom:8px">🚫 Removed Students (${removed.length})</div>`;
      removed.forEach(stu=>{
        const row=mk('div',{style:'background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;opacity:.6'});
        row.innerHTML=`<div style="flex:1"><div style="font-weight:600;font-size:12px;color:var(--sub)">${stu.name} • ${stu.phone}</div></div>`;
        const restoreBtn=mk('button',{style:'background:var(--green)18;border:1px solid var(--green)33;color:var(--green);border-radius:8px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit'});
        restoreBtn.textContent='Restore';
        restoreBtn.onclick=()=>{
          const idx=STUDENTS.findIndex(s=>s.id===stu.id);
          if(idx>=0){STUDENTS[idx].active=true;svStudents();draw();toast(`${stu.name} restore ho gaya!`);}
        };
        row.appendChild(restoreBtn);rt.appendChild(row);
      });
      w.appendChild(rt);
    }
  }

  window.removeStudent=function(id){
    showConfirmModal('Is student ko remove karein? Woh dobara login nahi kar payega jab tak restore na karein.',()=>{
      const idx=STUDENTS.findIndex(s=>s.id===id);
      if(idx>=0){
        const name=STUDENTS[idx].name;
        STUDENTS[idx].active=false;svStudents();draw();toast(`${name} remove ho gaya!`);
      }
    },'Remove');
  };

  draw();
  return w;
}

// ─── SETTINGS ────────────────────────────────────────────
function adSettings(){
  const w=mk('div');
  w.innerHTML=`<div style="font-weight:900;font-size:15px;color:var(--text);margin-bottom:16px">⚙️ Settings</div>`;

  // ── CHANGE CREDENTIALS ──
  const cc=mk('div',{class:'card',style:'margin-bottom:14px'});
  cc.innerHTML=`
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
    <div style="width:36px;height:36px;border-radius:10px;background:var(--red)20;display:flex;align-items:center;justify-content:center;font-size:18px">🔐</div>
    <div><div style="font-weight:800;font-size:14px;color:var(--text)">Login Credentials</div><div style="font-size:11px;color:var(--sub);margin-top:1px">Email aur password change karein</div></div>
  </div>
  <div style="background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:14px">
    <div style="font-size:11px;color:var(--sub);font-weight:600">Current Email</div>
    <div style="font-size:14px;color:var(--text);font-weight:700;margin-top:2px" id="cur-email">${CREDS.email}</div>
  </div>
  <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">📧 Naya Email</label>
    <input id="new-email" class="inp" type="email" value="${CREDS.email}" placeholder="nayi@email.com"></div>
  <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">🔑 Current Password (confirm karein)</label>
    <div style="position:relative"><input id="cur-p" class="inp" type="password" placeholder="Current password..." style="padding-right:44px">
    <button type="button" onclick="const i=document.getElementById('cur-p');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:var(--sub)">👁</button></div></div>
  <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">🔑 Naya Password</label>
    <div style="position:relative"><input id="new-p" class="inp" type="password" placeholder="Naya password (min 6 chars)..." style="padding-right:44px">
    <button type="button" onclick="const i=document.getElementById('new-p');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:var(--sub)">👁</button></div></div>
  <div style="margin-bottom:16px"><label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">🔑 Confirm Naya Password</label>
    <input id="conf-p" class="inp" type="password" placeholder="Password dobara likhein..."></div>`;

  const sv=mk('button',{class:'btn btn-red'});sv.textContent='🔐 Credentials Update Karo';
  sv.onclick=()=>{
    const cp=document.getElementById('cur-p')?.value;
    const ne=document.getElementById('new-email')?.value?.trim();
    const np=document.getElementById('new-p')?.value;
    const cfp=document.getElementById('conf-p')?.value;
    if(!cp){toast('Current password confirm karein!','err');return;}
    if(cp!==CREDS.password){toast('Current password galat hai!','err');return;}
    if(!ne){toast('Email daalna zaroori hai!','err');return;}
    if(np&&np.length<6){toast('Password kam se kam 6 characters ka hona chahiye!','err');return;}
    if(np&&np!==cfp){toast('Passwords match nahi kar rahe!','err');return;}
    CREDS.email=ne;
    if(np) CREDS.password=np;
    svCreds();
    const cem=document.getElementById('cur-email');if(cem)cem.textContent=CREDS.email;
    const adEmail=document.getElementById('ad-email');if(adEmail)adEmail.textContent=CREDS.email;
    document.getElementById('cur-p').value='';document.getElementById('new-p').value='';document.getElementById('conf-p').value='';
    toast('Credentials save ho gaye! ✅ Agla login naye password se karein');
  };
  cc.appendChild(sv);w.appendChild(cc);

  // ── AI ASSISTANT CONFIG ──
  const ai=mk('div',{class:'card',style:'margin-bottom:14px'});
  ai.innerHTML=`
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
    <div style="width:36px;height:36px;border-radius:10px;background:#6c63ff20;display:flex;align-items:center;justify-content:center;font-size:18px">🤖</div>
    <div><div style="font-weight:800;font-size:14px;color:var(--text)">AI Study Assistant</div><div style="font-size:11px;color:var(--sub);margin-top:1px">Floating chat button ke liye Gemini API key</div></div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:12px">
    <span style="font-size:13px;font-weight:700;color:var(--text)">Floating button dikhaayein</span>
    <button id="ai-toggle" style="width:44px;height:26px;border-radius:20px;border:none;cursor:pointer;background:${AICONFIG.enabled?'#6c63ff':'var(--border)'};position:relative">
      <span style="position:absolute;top:3px;left:${AICONFIG.enabled?'22px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s"></span>
    </button>
  </div>
  <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">🔑 Gemini API Key</label>
    <input id="ai-key" class="inp" type="password" value="${AICONFIG.apiKey||''}" placeholder="Google AI Studio se apni free key lo"></div>
  <div style="margin-bottom:14px"><label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">System Prompt (AI ka behavior)</label>
    <textarea id="ai-prompt" class="inp" rows="3">${escapeHtml(AICONFIG.systemPrompt||'')}</textarea></div>
  <div style="font-size:11px;color:var(--sub);margin-bottom:14px">Free key: <span style="color:var(--acc)">aistudio.google.com/apikey</span> par jaake "Get API Key" dabao.</div>`;
  const aiSaveBtn=mk('button',{class:'btn btn-acc'}); aiSaveBtn.textContent='💾 AI Settings Save Karo';
  aiSaveBtn.onclick=()=>{
    AICONFIG.apiKey=document.getElementById('ai-key').value.trim();
    AICONFIG.systemPrompt=document.getElementById('ai-prompt').value.trim();
    svAIConfig(); renderAIFab(); toast('AI settings save ho gayi! ✅');
  };
  ai.appendChild(aiSaveBtn);
  ai.querySelector('#ai-toggle').onclick=()=>{ AICONFIG.enabled=!AICONFIG.enabled; svAIConfig(); renderAIFab(); rebuildAdBody(); };
  w.appendChild(ai);

  // ── FEATURE LOCKS ──
  const fl=mk('div',{class:'card',style:'margin-bottom:14px'});
  fl.innerHTML=`<div style="font-weight:800;font-size:14px;color:var(--text);margin-bottom:4px">🔒 Feature Locks</div>
  <div style="font-size:12px;color:var(--sub);margin-bottom:12px">Kisi bhi section ko sabke liye band/chalu karo</div>`;
  [['chat','💬 Chat'],['mytube','📺 MyTube'],['success','🏆 Success'],['funzone','🎮 Fun Zone'],['community','🌐 Community'],['leaderboard','📊 Leaderboard']].forEach(([key,label])=>{
    const on=FEATURES[key]!==false;
    const row=mk('div',{style:'display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:8px'});
    row.innerHTML=`<span style="font-size:13px;font-weight:700;color:var(--text)">${label}</span>
    <button class="feat-toggle" data-key="${key}" style="width:44px;height:26px;border-radius:20px;border:none;cursor:pointer;background:${on?'#00d68f':'var(--border)'};position:relative">
      <span style="position:absolute;top:3px;left:${on?'22px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s"></span>
    </button>`;
    fl.appendChild(row);
  });
  fl.querySelectorAll('.feat-toggle').forEach(btn=>{
    btn.onclick=()=>{ const k=btn.dataset.key; FEATURES[k]=FEATURES[k]===false?true:false; svFeatures(); rebuildAdBody(); };
  });
  w.appendChild(fl);

  // ── DATA MANAGEMENT ──
  const dm=mk('div',{class:'card',style:'margin-bottom:14px'});
  dm.innerHTML=`<div style="font-weight:800;font-size:14px;color:var(--text);margin-bottom:12px">💾 Data</div>
  <div style="font-size:13px;color:var(--sub);margin-bottom:12px">${cloudReady ? 'Sab materials aur chapters <b style="color:var(--green)">cloud (Firebase)</b> mein sync hote hain — sabke phone mein turant pahunchte hain.' : 'Abhi sirf <b style="color:var(--orange)">is phone</b> mein save hain — Firebase config nahi jud paya, isliye doosre phones mein nahi pahunchega.'}</div>
  <div style="background:var(--card2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:12px;color:var(--text);font-weight:700">Materials saved:</div><div style="font-size:18px;font-weight:900;color:var(--acc)">${MATS.length}</div></div>
    <div style="text-align:right"><div style="font-size:12px;color:var(--text);font-weight:700">Chapters saved:</div><div style="font-size:18px;font-weight:900;color:var(--green)">${Object.values(CHAPTERS).reduce((s,c)=>s+c.length,0)}</div></div>
  </div>`;
  w.appendChild(dm);

  // ── DANGER ZONE ──
  const dz=mk('div',{style:'background:var(--red)10;border:1px solid var(--red)25;border-radius:14px;padding:14px'});
  dz.innerHTML='<div style="font-weight:800;font-size:13px;color:var(--red);margin-bottom:10px">⚠️ Danger Zone</div>';
  const delAll=mk('button',{style:'width:100%;padding:11px;border-radius:11px;background:transparent;border:1.5px solid var(--red)55;color:var(--red);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px'});
  delAll.textContent='🗑️ Sab Materials Delete Karo';
  delAll.onclick=()=>{ showConfirmModal('SURE? Sab materials permanently delete ho jayenge! Yeh action undo nahi ho sakta!',()=>{ MATS=[]; svMats(); toast('Sab materials delete ho gaye!'); rebuildAdBody(); },'Delete Sab'); };
  dz.appendChild(delAll);
  const logout=mk('button',{style:'width:100%;padding:11px;border-radius:11px;background:transparent;border:1.5px solid var(--border);color:var(--sub);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit'});
  logout.textContent='🚪 Admin Logout';
  logout.onclick=()=>{ showConfirmModal('Admin logout karein?',()=>{ go({view:'main',nav:'home'}); },'Logout'); };
  dz.appendChild(logout);
  w.appendChild(dz);
  return w;
}

// ════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════
// Update last seen on every app open
updateStudentLastSeen();

// If not logged in → show login screen, else go home
if(!CUR_STUDENT){
  showStudentLogin();
} else {
  S.cls = CUR_STUDENT.cls || '10';
  S.studyCls = CUR_STUDENT.cls || '10';
  render();
}
startCloudSync();
</script>
</body>
</html>
