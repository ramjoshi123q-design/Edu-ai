async function callGemini(history){
  if(!AICONFIG.apiKey) throw new Error('NO_KEY');
  const contents=history.map(m=>({role:m.role==='ai'?'model':'user', parts:[{text:m.text}]}));
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(AICONFIG.apiKey)}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ contents, systemInstruction:{parts:[{text:AICONFIG.systemPrompt||''}]} })
  });
  if(!res.ok){
    let detail=res.status;
    try{ const errBody=await res.json(); if(errBody?.error?.message) detail=errBody.error.message; }catch(e){}
    throw new Error('API_ERROR: '+detail);
  }
  const data=await res.json();
  const text=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || 'Maaf karo, jawaab nahi mila.';
  return text;
}
function openAIChat(){
  const ov=mk('div',{class:'ov',style:'display:flex;flex-direction:column'});
  const tb=mk('div',{style:'background:linear-gradient(135deg,#2e2a5c,#3d3778);padding:11px 15px;display:flex;align-items:center;gap:10px;flex-shrink:0;height:58px;border-bottom:1px solid rgba(108,99,255,.25)'});
  tb.innerHTML=`<button id="ai-close" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px;font-family:inherit">← Band Karo</button>
    <div style="font-weight:900;font-size:15px;color:#fff">🤖 AI Study Assistant</div>`;
  ov.appendChild(tb);
  tb.querySelector('#ai-close').onclick=()=>ov.remove();

  const msgs=mk('div',{id:'ai-msgs',style:'flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px'});
  if(!AICONFIG.apiKey){
    msgs.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--sub)"><div style="font-size:40px;margin-bottom:10px">🤖</div><div style="font-size:14px">AI Assistant abhi setup nahi hua hai. Admin ko Settings mein apni AI API key daalni hogi.</div></div>`;
  } else {
    msgs.innerHTML=`<div style="align-self:flex-start;max-width:82%;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px 13px;font-size:13px;color:var(--text)">Namaste ${CUR_STUDENT?CUR_STUDENT.name:''}! Main tumhara AI study assistant hoon. Kuch bhi poochho — koi topic samajhna ho, doubt clear karna ho, ya guidance chahiye ho. 😊</div>`;
  }
  ov.appendChild(msgs);

  const history=[];
  const inputBar=d('display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0');
  const txt=mk('input',{type:'text',placeholder:AICONFIG.apiKey?'Apna sawal likho...':'Pehle admin ko API key daalni hogi',style:'flex:1;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-size:13px;font-family:inherit'});
  const sendBtn=mk('button',{style:'background:#6c63ff;color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;flex-shrink:0'}); sendBtn.textContent='➤';
  if(!AICONFIG.apiKey){ txt.disabled=true; sendBtn.disabled=true; sendBtn.style.opacity='.5'; }
  const addBubble=(text,who)=>{
    const mine=who==='user';
    const b=mk('div',{style:`max-width:82%;align-self:${mine?'flex-end':'flex-start'};background:${mine?'#6c63ff22':'var(--card2)'};border:1px solid ${mine?'#6c63ff44':'var(--border)'};border-radius:14px;padding:10px 13px;font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word`});
    b.textContent=text;
    msgs.appendChild(b); msgs.scrollTop=msgs.scrollHeight;
    return b;
  };
  const doSend=async()=>{
    const val=txt.value.trim(); if(!val) return;
    txt.value=''; addBubble(val,'user'); history.push({role:'user',text:val});
    const loadingB=addBubble('...','ai');
    sendBtn.disabled=true;
    try{
      const reply=await callGemini(history);
      loadingB.textContent=reply;
      history.push({role:'ai',text:reply});
    }catch(e){
      loadingB.textContent = e.message==='NO_KEY' ? 'API key set nahi hai — Admin Settings check karo.' : `Error: ${e.message} — Admin ko ye batao taaki wo API key/setup check kar sake.`;
      loadingB.style.color='var(--red)';
    }
    sendBtn.disabled=false;
    msgs.scrollTop=msgs.scrollHeight;
  };
  sendBtn.onclick=doSend;
  txt.addEventListener('keydown',e=>{ if(e.key==='Enter') doSend(); });
  inputBar.appendChild(txt); inputBar.appendChild(sendBtn);
  ov.appendChild(inputBar);
  document.getElementById('root').appendChild(ov);
}

  const tb=mk('div',{style:'background:linear-gradient(135deg,#0a2e1a,#0d3d22);border-bottom:1px solid rgba(37,211,102,.2);padding:11px 15px;display:flex;align-items:center;gap:10px;flex-shrink:0;height:58px'});
  const curGroup = S.chatGroup ? GROUPS.find(g=>g.id===S.chatGroup) : null;
  tb.innerHTML=`<button id="ch-back" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px;font-family:inherit">← ${curGroup?'Groups':'App'}</button>
    <div style="font-weight:900;font-size:15px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">💬 ${curGroup?curGroup.name:'Chat'}</div>`;
  w.appendChild(tb);
  tb.querySelector('#ch-back').onclick=()=>{
    if(window.__chatUnsub){ window.__chatUnsub(); window.__chatUnsub=null; }
    curGroup ? go({chatGroup:null}) : go({view:null});
  };

  if(!curGroup){
    const body=d('flex:1;overflow-y:auto');
    const actions=d('padding:14px;display:flex;gap:8px');
    const mkA=(label,ic,fn)=>{ const b=mk('button',{style:'flex:1;background:#25d366;color:#fff;font-weight:700;border:none;border-radius:12px;padding:11px;font-size:13px;cursor:pointer;font-family:inherit'}); b.innerHTML=`${ic} ${label}`; b.onclick=fn; return b; };
    actions.appendChild(mkA('Naya Group','➕',()=>{
      showInputModal('Naya Group Banao','Group ka naam likho',name=>{
        const icons=['👥','📚','🎯','🔥','⭐','🚀'];
        const g={ id:'grp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name:name, icon:icons[Math.floor(Math.random()*icons.length)], joinCode:Math.random().toString(36).slice(2,8).toUpperCase(), members:[CUR_STUDENT.id], createdBy:CUR_STUDENT.id, createdAt:new Date().toISOString() };
        GROUPS.push(g); svGroups(); logActivity('💬','Naya group bana: '+g.name);
        toast(`Group ban gaya! Join code: ${g.joinCode}`,'ok');
        go({chatGroup:g.id});
      });
    }));
    actions.appendChild(mkA('Join Karo','🔗',()=>{
      showInputModal('Group Join Karo','Join code likho (jaise AB12CD)',code=>{
        const g=GROUPS.find(x=>x.joinCode===code.toUpperCase());
        if(!g){ toast('Ye code kisi group se match nahi hua','warn'); return; }
        if(!g.members.includes(CUR_STUDENT.id)){ g.members.push(CUR_STUDENT.id); svGroups(); }
        toast(`${g.name} join ho gaya!`,'ok');
        go({chatGroup:g.id});
      });
    }));
    body.appendChild(actions);

    const myGroups=GROUPS.filter(g=>CUR_STUDENT&&g.members&&g.members.includes(CUR_STUDENT.id));
    if(myGroups.length===0){
      const empty=d('padding:40px 20px;text-align:center;color:var(--sub)');
      empty.innerHTML=`<div style="font-size:40px;margin-bottom:10px">💬</div><div style="font-size:14px">Koi group nahi hai abhi. Naya group banao ya kisi ka code daal ke join karo!</div>`;
      body.appendChild(empty);
    } else {
      const list=d('padding:0 14px');
      myGroups.forEach(g=>{
        const row=mk('div',{style:'display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;cursor:pointer'});
        row.innerHTML=`<div style="width:44px;height:44px;border-radius:50%;background:#25d36622;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${g.icon||'👥'}</div>
          <div style="flex:1;overflow:hidden"><div style="font-weight:700;font-size:14px;color:var(--text)">${g.name}</div><div style="font-size:11px;color:var(--sub)">${(g.members||[]).length} members · Code: ${g.joinCode}</div></div>
          <button class="grp-leave" style="background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:6px;flex-shrink:0">🗑️</button>
          <span style="color:var(--sub);font-size:16px">›</span>`;
        row.onclick=()=>go({chatGroup:g.id});
        row.querySelector('.grp-leave').onclick=(e)=>{
          e.stopPropagation();
          const isCreator=g.createdBy===CUR_STUDENT.id;
          const willDelete=isCreator && (g.members||[]).length<=1;
          showConfirmModal(willDelete?`"${g.name}" hamesha ke liye delete ho jaayega (sab messages bhi). Pakka?`:`"${g.name}" chhod dein?`, ()=>{
            if(willDelete){
              GROUPS=GROUPS.filter(x=>x.id!==g.id); svGroups();
              if(cloudReady) cloudDB.collection('eduai_groups').doc(g.id).delete().catch(()=>{});
            } else {
              g.members=(g.members||[]).filter(id=>id!==CUR_STUDENT.id); svGroups();
            }
            go({chatGroup:null}); toast(willDelete?'Group delete ho gaya!':'Group chhod diya!');
          }, willDelete?'Delete':'Chhodo');
        };
        list.appendChild(row);
      });
      body.appendChild(list);
    }
    w.appendChild(body);
    return w;
  }

  const msgWrap=mk('div',{id:'chat-msgs',style:'flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px'});
  msgWrap.innerHTML='<div style="text-align:center;color:var(--sub);font-size:12px">Loading...</div>';
  w.appendChild(msgWrap);

  if(window.__chatUnsub) window.__chatUnsub();
  window.__chatUnsub=listenToGroupMessages(curGroup.id, msgs=>{
    const el=document.getElementById('chat-msgs'); if(!el) return;
    el.innerHTML='';
    if(msgs.length===0){ el.innerHTML='<div style="text-align:center;color:var(--sub);font-size:12px;margin-top:20px">Abhi tak koi message nahi. Pehla message bhejo!</div>'; }
    msgs.forEach(m=>{
      const mine=CUR_STUDENT&&m.senderId===CUR_STUDENT.id;
      const bub=mk('div',{style:`max-width:78%;align-self:${mine?'flex-end':'flex-start'};background:${mine?'#25d36622':'var(--card2)'};border:1px solid ${mine?'#25d36644':'var(--border)'};border-radius:14px;padding:9px 12px`});
      let inner=`<div style="font-size:10px;font-weight:700;color:${mine?'#25d366':'var(--acc)'};margin-bottom:2px">${mine?'Tum':escapeHtml(m.senderName||'')}</div>`;
      if(m.text) inner+=`<div style="font-size:13px;color:var(--text);word-break:break-word">${escapeHtml(m.text)}</div>`;
      if(m.imageBase64) inner+=`<img src="${m.imageBase64}" style="max-width:100%;border-radius:8px;margin-top:5px">`;
      if(m.linkUrl) inner+=`<a href="${m.linkUrl}" target="_blank" style="display:block;margin-top:5px;color:${mine?'#25d366':'var(--acc)'};font-size:12px;word-break:break-all">🔗 ${escapeHtml(m.linkLabel||m.linkUrl)}</a>`;
      bub.innerHTML=inner;
      el.appendChild(bub);
    });
    el.scrollTop=el.scrollHeight;
  });

  const inputBar=d('display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;align-items:center');
  const fileBtn=mk('button',{style:'background:none;border:none;font-size:20px;cursor:pointer;flex-shrink:0'}); fileBtn.textContent='📎';
  const fileInput=mk('input',{type:'file',accept:'image/*',style:'display:none'});
  fileBtn.onclick=()=>fileInput.click();
  fileInput.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const maxW=640, scale=Math.min(1,maxW/img.width);
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        sendGroupMessage(curGroup.id,{imageBase64:canvas.toDataURL('image/jpeg',0.6)});
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
  const txt=mk('input',{type:'text',placeholder:'Message likho... (ya PDF/video ka link paste karo)',style:'flex:1;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-size:13px;font-family:inherit'});
  const sendBtn=mk('button',{style:'background:#25d366;color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;flex-shrink:0'}); sendBtn.textContent='➤';
  const doSend=()=>{
    const val=txt.value.trim(); if(!val) return;
    if(/^https?:\/\//i.test(val)) sendGroupMessage(curGroup.id,{linkUrl:val,linkLabel:'Link'});
    else sendGroupMessage(curGroup.id,{text:val});
    txt.value='';
  };
  sendBtn.onclick=doSend;
  txt.addEventListener('keydown',e=>{ if(e.key==='Enter') doSend(); });
  inputBar.appendChild(fileBtn); inputBar.appendChild(fileInput); inputBar.appendChild(txt); inputBar.appendChild(sendBtn);
  w.appendChild(inputBar);
  return w;
}

function videoCard(v,isShort){
  const ch=CHANNELS.find(c=>c.id===v.channelId);
  const card=mk('div',{style:`cursor:pointer;${isShort?'aspect-ratio:9/16':''}`});
  card.innerHTML=`<img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg" style="width:100%;${isShort?'height:100%;object-fit:cover':'aspect-ratio:16/9;object-fit:cover'};border-radius:12px;background:#000">
    ${!isShort?`<div style="padding:6px 2px"><div style="font-weight:700;font-size:13px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(v.title)}</div><div style="font-size:11px;color:var(--sub);margin-top:2px">${ch?escapeHtml(ch.name):''} · ${(v.likes||[]).length} likes</div></div>`:''}`;
  card.onclick=()=>go({view:'mytube',tubeView:'video',tubeVideo:v.id});
  return card;
}
function openAddVideo(channelId){
  showInputModal('Video Add Karo','YouTube video/short ka link paste karo',url=>{
    const match=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{11})/);
    if(!match){ toast('Ye valid YouTube link nahi lag raha','warn'); return; }
    const isShort=url.includes('/shorts/');
    showInputModal('Video ka Title','Title likho',title=>{
      showInputModal('Description (optional)','Video ke baare mein thoda likho',desc=>{
        VIDEOS.push({id:'vid_'+Date.now(),channelId,youtubeId:match[1],title,description:desc,isShort,likes:[],comments:[],views:0,date:new Date().toISOString()});
        svVideos(); logActivity('📺','Naya video add hua: '+title); toast('Video add ho gaya! ✅','ok'); render();
      },{allowEmpty:true,textarea:true});
    });
  });
}
function openAddChannelPost(channelId){
  const ov=mk('div',{class:'ov',style:'display:flex;align-items:flex-end;justify-content:center'});
  const card=mk('div',{style:'background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:430px'});
  card.innerHTML=`<div style="font-weight:800;font-size:15px;color:var(--text);margin-bottom:12px">📷 Photo Post</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <button id="chp-photo-btn" class="btn btn-ghost" style="flex:1">📷 Photo Chuno</button>
      <input id="chp-photo" type="file" accept="image/*" style="display:none">
    </div>
    <div id="chp-preview" style="margin-bottom:10px"></div>
    <textarea id="chp-caption" class="inp" rows="2" placeholder="Caption (optional)" style="margin-bottom:14px"></textarea>
    <div style="display:flex;gap:8px">
      <button id="chp-cancel" class="btn btn-ghost" style="flex:1">Cancel</button>
      <button id="chp-post" class="btn btn-acc" style="flex:1">Post Karo</button>
    </div>`;
  ov.appendChild(card); document.getElementById('root').appendChild(ov);
  let imgData=null;
  card.querySelector('#chp-photo-btn').onclick=()=>card.querySelector('#chp-photo').click();
  card.querySelector('#chp-photo').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas'); const maxW=800, scale=Math.min(1,maxW/img.width);
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        imgData=canvas.toDataURL('image/jpeg',0.65);
        card.querySelector('#chp-preview').innerHTML=`<img src="${imgData}" style="width:100%;border-radius:10px">`;
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
  card.querySelector('#chp-cancel').onclick=()=>ov.remove();
  card.querySelector('#chp-post').onclick=()=>{
    if(!imgData){ toast('Pehle photo chuno','warn'); return; }
    CHANNEL_POSTS.push({ id:'chpost_'+Date.now(), channelId, imageBase64:imgData, caption:card.querySelector('#chp-caption').value.trim(), likes:[], date:new Date().toISOString() });
    svChannelPosts(); ov.remove(); toast('Post ho gaya! ✅'); render();
  };
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
function openEditVideo(videoId){

    showInputModal('Description Edit Karo','Description likho',desc=>{
      v.title=title; v.description=desc; svVideos(); toast('Update ho gaya! ✅','ok'); render();
    },{allowEmpty:true,textarea:true,value:v.description});
  },{value:v.title});
}
function buildMyTube(){
  const w=mk('div',{style:'min-height:100dvh;background:var(--bg);display:flex;flex-direction:column'});
  const tb=mk('div',{style:'background:linear-gradient(135deg,#2e0a0a,#3d0d0d);border-bottom:1px solid rgba(255,0,0,.2);padding:11px 15px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:58px'});
  tb.innerHTML=`<div style="display:flex;align-items:center;gap:10px">
    <button id="mt-back" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px;font-family:inherit">← Back</button>
    <div style="font-weight:900;font-size:16px;color:#fff">📺 MyTube</div></div>
  <button id="mt-mychannel" style="background:#ff0000;color:#fff;border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">My Channel</button>`;
  w.appendChild(tb);
  tb.querySelector('#mt-mychannel').onclick=()=>go({tubeView:'mychannel'});

  const body=d('flex:1;overflow-y:auto;padding-bottom:20px');

  if(S.tubeView==='video'&&S.tubeVideo){

    const player=d('width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0');

    body.appendChild(player);
    const liked=CUR_STUDENT&&(v.likes||[]).includes(CUR_STUDENT.id);
    const subscribed=ch&&CUR_STUDENT&&(ch.subscribers||[]).includes(CUR_STUDENT.id);
    const info=d('padding:14px');
    info.innerHTML=`<div style="font-weight:800;font-size:15px;color:var(--text);margin-bottom:6px">${escapeHtml(v.title)}</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${v.views||0} views</div>

        <div style="display:flex;align-items:center;gap:9px"><div style="width:36px;height:36px;border-radius:50%;background:#ff000022;display:flex;align-items:center;justify-content:center;font-size:16px">${ch?ch.icon:'📺'}</div>
        <div><div style="font-weight:700;font-size:13px;color:var(--text)">${ch?escapeHtml(ch.name):'Unknown'}</div><div style="font-size:10px;color:var(--sub)">${ch?(ch.subscribers||[]).length:0} subscribers</div></div></div>
        <button id="mt-sub-btn" style="background:${subscribed?'var(--card2)':'#ff0000'};color:${subscribed?'var(--text)':'#fff'};border:1px solid ${subscribed?'var(--border)':'transparent'};border-radius:20px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${subscribed?'Subscribed ✓':'Subscribe'}</button>
      </div>
      <button id="mt-like-btn" style="background:${liked?'var(--acc)22':'var(--card2)'};border:1px solid ${liked?'var(--acc)':'var(--border)'};color:${liked?'var(--acc)':'var(--text)'};border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;font-family:inherit">${liked?'❤️':'🤍'} ${(v.likes||[]).length}</button>
      ${ch&&CUR_STUDENT&&ch.ownerId===CUR_STUDENT.id?`<button id="mt-edit-btn" style="background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;margin-left:8px;font-family:inherit">✏️ Edit</button>`:''}

      const sb=document.getElementById('mt-sub-btn');
      if(sb&&ch) sb.onclick=()=>{ if(!ch.subscribers)ch.subscribers=[]; const i=ch.subscribers.indexOf(CUR_STUDENT.id); i>=0?ch.subscribers.splice(i,1):ch.subscribers.push(CUR_STUDENT.id); svChannels(); render(); };
      const eb=document.getElementById('mt-edit-btn');

    return w;
  }

  if(S.tubeView==='mychannel'){
    tb.querySelector('#mt-back').onclick=()=>go({tubeView:null});

          svChannels(); render();

    } else {

      addBtn.onclick=()=>openAddVideo(myCh.id);
      const postBtn=mk('button',{style:'background:var(--card2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:8px'}); postBtn.textContent='📷 Post';
      postBtn.onclick=()=>openAddChannelPost(myCh.id);
      hd.appendChild(addBtn); hd.appendChild(postBtn); body.appendChild(hd);
      const myVids=VIDEOS.filter(v=>v.channelId===myCh.id);
      const grid=d('padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px');
      myVids.forEach(v=>grid.appendChild(videoCard(v,false)));
      body.appendChild(grid);
      if(myVids.length===0){ const e=d('padding:20px;text-align:center;color:var(--sub);font-size:13px'); e.textContent='Koi video nahi hai. Upar se add karo!'; body.appendChild(e); }
      const myPosts=CHANNEL_POSTS.filter(p=>p.channelId===myCh.id);

        const ptitle=d('padding:16px 14px 8px'); ptitle.innerHTML='<div style="font-weight:800;font-size:13px;color:var(--text)">📷 Photo Posts</div>'; body.appendChild(ptitle);
        const pgrid=d('padding:0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px');
        myPosts.slice().reverse().forEach(p=>{ const img=mk('img',{src:p.imageBase64,style:'width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px'}); pgrid.appendChild(img); });
        body.appendChild(pgrid);
      }
    }
    w.appendChild(body);
    return w;
  }

  tb.querySelector('#mt-back').onclick=()=>go({view:null,tubeView:null,tubeVideo:null});
  const tabs=d('display:flex;gap:8px;padding:12px 14px 0');
  const activeFilter=S.tubeFilter||'all';
  ['all','shorts','posts'].forEach(t=>{
    const on=activeFilter===t;
    const b=mk('button',{style:`padding:7px 16px;border-radius:20px;border:1.5px solid ${on?'#ff0000':'var(--border)'};background:${on?'#ff000022':'transparent'};color:${on?'#ff0000':'var(--sub)'};font-weight:700;font-size:12px;cursor:pointer;font-family:inherit`});
    b.textContent=t==='all'?'Videos':t==='shorts'?'Shorts':'Posts';
    b.onclick=()=>go({tubeFilter:t});
    tabs.appendChild(b);
  });
  body.appendChild(tabs);
  if(activeFilter==='posts'){
    const plist=d('padding:14px');
    const posts=[...CHANNEL_POSTS].reverse();
    if(posts.length===0) plist.innerHTML='<div style="text-align:center;color:var(--sub);padding:30px;font-size:13px">Koi photo post nahi hai abhi</div>';
    posts.forEach(p=>{
      const ch=CHANNELS.find(c=>c.id===p.channelId);
      const liked=CUR_STUDENT&&(p.likes||[]).includes(CUR_STUDENT.id);
      const card=mk('div',{style:'background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px'});
      card.innerHTML=`<div style="padding:11px 13px;display:flex;align-items:center;gap:8px"><div style="font-size:16px">${ch?ch.icon:'📺'}</div><div style="font-weight:700;font-size:12px;color:var(--text)">${ch?escapeHtml(ch.name):'Unknown'}</div></div>
        <img src="${p.imageBase64}" style="width:100%;display:block">
        <div style="padding:11px 13px">
          ${p.caption?`<div style="font-size:13px;color:var(--text);margin-bottom:8px">${escapeHtml(p.caption)}</div>`:''}
          <button class="cp-like" style="background:none;border:none;color:${liked?'var(--red)':'var(--sub)'};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${liked?'❤️':'🤍'} ${(p.likes||[]).length}</button>
        </div>`;
      card.querySelector('.cp-like').onclick=()=>{ if(!p.likes)p.likes=[]; const i=p.likes.indexOf(CUR_STUDENT.id); i>=0?p.likes.splice(i,1):p.likes.push(CUR_STUDENT.id); svChannelPosts(); go({view:'mytube',tubeFilter:'posts'}); };
      plist.appendChild(card);
    });
    body.appendChild(plist);
    w.appendChild(body);
    return w;
  }
  const isShorts=activeFilter==='shorts';
  const feed=VIDEOS.filter(v=>isShorts?v.isShort:!v.isShort).slice().reverse();
  const grid=d(`padding:14px;display:grid;grid-template-columns:${isShorts?'repeat(3,1fr)':'1fr'};gap:12px`);
  if(feed.length===0) grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--sub);padding:30px;font-size:13px">Koi video nahi hai abhi</div>';
  feed.forEach(v=>grid.appendChild(videoCard(v,isShorts)));
  body.appendChild(grid);
  w.appendChild(body);
  return w;
}

      if(post.imageBase64) inner+=`<img src="${post.imageBase64}" style="width:100%;border-radius:10px;margin-bottom:9px">`;
      if(post.linkUrl) inner+=`<a href="${post.linkUrl}" target="_blank" style="display:block;color:var(--acc);font-size:12px;margin-bottom:9px;word-break:break-all">🔗 ${escapeHtml(post.linkLabel||post.linkUrl)}</a>`;
      inner+=`<div style="display:flex;gap:14px;padding-top:8px;border-top:1px solid var(--border)">
        <button class="cm-like" style="background:none;border:none;color:${liked?'var(--red)':'var(--sub)'};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">${liked?'❤️':'🤍'} ${(post.likes||[]).length}</button>
        <button class="cm-cmt" style="background:none;border:none;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">💬 ${(post.comments||[]).length}</button>
        ${CUR_STUDENT&&post.authorId===CUR_STUDENT.id?`<button class="cm-del" style="background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:auto">🗑️</button>`:''}
      </div><div class="cm-cmts" style="display:none;margin-top:9px"></div>`;
      card.innerHTML=inner;
      card.querySelector('.cm-like').onclick=()=>{ if(!post.likes)post.likes=[]; const i=post.likes.indexOf(CUR_STUDENT.id); i>=0?post.likes.splice(i,1):post.likes.push(CUR_STUDENT.id); svCommunity(); go({view:'community'}); };
      const delBtn=card.querySelector('.cm-del');
      if(delBtn) delBtn.onclick=()=>showConfirmModal('Ye post delete karein?',()=>{ COMMUNITY=COMMUNITY.filter(x=>x.id!==post.id); svCommunity(); go({view:'community'}); toast('Delete ho gaya!'); });
      const cmtBox=card.querySelector('.cm-cmts');
      card.querySelector('.cm-cmt').onclick=()=>{
        const show=cmtBox.style.display==='none';

          inputRow.appendChild(inp); inputRow.appendChild(sb); cmtBox.appendChild(inputRow);
        }
      };
      body.appendChild(card);
    });
  }
  w.appendChild(body);
  const fab=mk('button',{style:'position:absolute;bottom:20px;right:18px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#0891b2);border:none;font-size:24px;box-shadow:0 6px 18px rgba(34,211,238,.4);cursor:pointer;z-index:10'});

}
function initTTT(root){
  let board=Array(9).fill(null), turn='X', over=false;
  function checkWin(){
    const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const[a,b,c] of L) if(board[a]&&board[a]===board[b]&&board[b]===board[c]) return board[a];
    if(board.every(x=>x)) return 'D';
    return null;
  }
  function draw(){
    root.innerHTML='';
    const winner=checkWin();
    const status=d('font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;text-align:center');
    status.textContent=winner?(winner==='D'?'Draw ho gaya! 🤝':`${winner} jeet gaya! 🎉`):`Turn: ${turn}`;
    root.appendChild(status);
    const grid=d('display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,84px);gap:7px');
    board.forEach((v,i)=>{
      const cell=mk('button',{style:`background:var(--card);border:1.5px solid var(--border);border-radius:12px;font-size:34px;font-weight:900;color:${v==='X'?'var(--acc)':'var(--red)'};cursor:pointer;font-family:inherit`});
      cell.textContent=v||'';
      cell.onclick=()=>{ if(board[i]||over) return; board[i]=turn; if(checkWin()) over=true; else turn=turn==='X'?'O':'X'; draw(); };
      grid.appendChild(cell);
    });
    root.appendChild(grid);
    const rb=mk('button',{class:'btn btn-acc',style:'margin-top:18px;max-width:180px'}); rb.textContent='🔄 Naya Game';
    rb.onclick=()=>{ board=Array(9).fill(null); turn='X'; over=false; draw(); };
    root.appendChild(rb);
  }
  draw();
}
function initFlappy(root){
  const canvas=mk('canvas',{width:'300',height:'420',style:'background:#4ec0ca;border-radius:14px;max-width:100%;touch-action:none'});
  root.appendChild(canvas);
  const info=d('margin-top:10px;text-align:center;color:var(--sub);font-size:12px'); info.textContent='Tap/Click karke udo';
  root.appendChild(info);
  const ctx=canvas.getContext('2d');
  let bird,pipes,score,over,started;
  const G=0.4, FLAP=-7, PW=46, GAP=130;
  function reset(){ bird={x:55,y:180,vy:0}; pipes=[{x:300,h:130}]; score=0; over=false; started=false; }
  function flap(){ if(over){reset();return;} started=true; bird.vy=FLAP; }
  canvas.addEventListener('pointerdown',flap);
  function loop(){
    if(started&&!over){
      bird.vy+=G; bird.y+=bird.vy;
      pipes.forEach(p=>p.x-=2.4);
      if(pipes[pipes.length-1].x<170) pipes.push({x:300,h:50+Math.random()*170});
      if(pipes[0].x<-PW){ pipes.shift(); score++; }
      pipes.forEach(p=>{ if(bird.x+13>p.x&&bird.x-13<p.x+PW&&(bird.y-13<p.h||bird.y+13>p.h+GAP)) over=true; });
      if(bird.y>420||bird.y<0) over=true;
    }
    ctx.fillStyle='#4ec0ca'; ctx.fillRect(0,0,300,420);
    ctx.fillStyle='#5cb85c';
    pipes.forEach(p=>{ ctx.fillRect(p.x,0,PW,p.h); ctx.fillRect(p.x,p.h+GAP,PW,420-p.h-GAP); });
    ctx.fillStyle='#ffd43b'; ctx.beginPath(); ctx.arc(bird.x,bird.y,13,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText(score,140,44);
    if(!started){ ctx.textAlign='center'; ctx.fillText('Tap to start',150,210); ctx.textAlign='left'; }
    if(over){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,160,300,90); ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText('Game Over! Tap to retry',150,210); ctx.textAlign='left'; }
    window.__gameLoopId=requestAnimationFrame(loop);
  }
  reset(); loop();
}
function initRunner(root){
  const canvas=mk('canvas',{width:'300',height:'190',style:'border-radius:14px;max-width:100%;touch-action:none'});
  root.appendChild(canvas);
  const info=d('margin-top:10px;text-align:center;color:var(--sub);font-size:12px'); info.textContent='Tap/Click karke kudo';
  root.appendChild(info);
  const ctx=canvas.getContext('2d');
  let player,obstacles,score,speed,over,started;
  function reset(){ player={y:130,vy:0,jumping:false}; obstacles=[{x:300}]; score=0; speed=3; over=false; started=false; }
  function jump(){ if(over){reset();return;} started=true; if(!player.jumping){ player.vy=-8.5; player.jumping=true; } }
  canvas.addEventListener('pointerdown',jump);
  function loop(){
    if(started&&!over){
      player.vy+=0.5; player.y+=player.vy; if(player.y>130){player.y=130;player.vy=0;player.jumping=false;}
      obstacles.forEach(o=>o.x-=speed);
      if(obstacles[obstacles.length-1].x<190) obstacles.push({x:320});
      if(obstacles[0].x<-20){ obstacles.shift(); score++; speed=Math.min(speed+0.15,8); }
      obstacles.forEach(o=>{ if(o.x<66&&o.x>26&&player.y>100) over=true; });
    }
    ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,300,130);
    ctx.fillStyle='#5a3921'; ctx.fillRect(0,130,300,60);
    ctx.fillStyle='#e63946'; ctx.fillRect(34,player.y-28,26,28);
    ctx.fillStyle='#2d6a4f'; obstacles.forEach(o=>ctx.fillRect(o.x,100,20,30));
    ctx.fillStyle='#000'; ctx.font='bold 16px sans-serif'; ctx.fillText('Score: '+score,10,22);
    if(!started){ ctx.textAlign='center'; ctx.fillText('Tap to start',150,75); ctx.textAlign='left'; }
    if(over){ ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,55,300,50); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('Game Over! Tap to retry',150,85); ctx.textAlign='left'; }
    window.__gameLoopId=requestAnimationFrame(loop);
  }
  reset(); loop();
}
function initBlock(root){
  const COLS_N=8,ROWS_N=14,CELL=24;
  const canvas=mk('canvas',{width:COLS_N*CELL,height:ROWS_N*CELL,style:'background:#111;border-radius:10px;max-width:100%'});
  root.appendChild(canvas);
  const ctrl=d('display:flex;gap:8px;margin-top:10px');
  root.appendChild(ctrl);
  const scoreEl=d('margin-top:8px;color:var(--sub);font-size:13px;font-weight:700'); root.appendChild(scoreEl);
  const ctx=canvas.getContext('2d');
  const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],L:[[1,0],[1,0],[1,1]],S:[[0,1,1],[1,1,0]]};
  const PCOL={I:'#22d3ee',O:'#ffd43b',T:'#a78bfa',L:'#ff922b',S:'#00d68f'};
  let grid=Array.from({length:ROWS_N},()=>Array(COLS_N).fill(null)), cur, score=0, over=false;
  function collide(p,dx,dy,shape){
    const s=shape||p.shape;
    for(let y=0;y<s.length;y++)for(let x=0;x<s[y].length;x++){
      if(!s[y][x]) continue;
      const ny=p.y+y+dy, nx=p.x+x+dx;
      if(nx<0||nx>=COLS_N||ny>=ROWS_N) return true;
      if(ny>=0&&grid[ny][nx]) return true;
    }
    return false;
  }
  function newPiece(){ const keys=Object.keys(SHAPES); const k=keys[Math.floor(Math.random()*keys.length)]; cur={shape:SHAPES[k].map(r=>[...r]),k,x:Math.floor(COLS_N/2)-1,y:0}; if(collide(cur,0,0)) over=true; }
  function merge(){ cur.shape.forEach((row,y)=>row.forEach((v,x)=>{ if(v){ const ny=cur.y+y,nx=cur.x+x; if(ny>=0) grid[ny][nx]=cur.k; } })); }
  function clearLines(){ let c=0; grid=grid.filter(row=>{ if(row.every(x=>x)){c++;return false;} return true; }); while(grid.length<ROWS_N) grid.unshift(Array(COLS_N).fill(null)); score+=c*100; }
  function rotate(){ const s=cur.shape; const r=s[0].map((_,i)=>s.map(row=>row[i]).reverse()); if(!collide(cur,0,0,r)) cur.shape=r; }
  function dropOne(){ if(!collide(cur,0,1)) cur.y++; else { merge(); clearLines(); newPiece(); } }
  function draw(){
    ctx.fillStyle='#111'; ctx.fillRect(0,0,COLS_N*CELL,ROWS_N*CELL);
    grid.forEach((row,y)=>row.forEach((v,x)=>{ if(v){ ctx.fillStyle=PCOL[v]; ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2); } }));
    if(cur&&!over) cur.shape.forEach((row,y)=>row.forEach((v,x)=>{ if(v){ ctx.fillStyle=PCOL[cur.k]; ctx.fillRect((cur.x+x)*CELL+1,(cur.y+y)*CELL+1,CELL-2,CELL-2); } }));
    scoreEl.textContent=over?`Game Over! Score: ${score} (⟲ dabao restart ke liye)`:`Score: ${score}`;
  }
  ['⟲','←','↓','→'].forEach(sym=>{
    const b=mk('button',{style:'width:50px;height:42px;background:var(--card2);border:1px solid var(--border);border-radius:10px;font-size:17px;color:var(--text);cursor:pointer;font-family:inherit'});
    b.textContent=sym;
    b.onclick=()=>{
      if(over){ grid=Array.from({length:ROWS_N},()=>Array(COLS_N).fill(null)); score=0; over=false; newPiece(); draw(); return; }
      if(sym==='⟲') rotate();
      else if(sym==='←'&&!collide(cur,-1,0)) cur.x--;
      else if(sym==='→'&&!collide(cur,1,0)) cur.x++;
      else if(sym==='↓') dropOne();
      draw();
    };
    ctrl.appendChild(b);
  });
  newPiece();
  window.__gameInterval=setInterval(()=>{ if(!over){ dropOne(); draw(); } },700);
  draw();
}
function initMemory(root){
  const EMOJIS=['📚','✏️','🎯','🔬','🧮','🌟','🎨','🏆'];
  let cards=[...EMOJIS,...EMOJIS].sort(()=>Math.random()-0.5).map((e,i)=>({id:i,val:e,flipped:false,matched:false}));
  let flippedIds=[], moves=0, locked=false;
  const stats=d('margin-bottom:12px;color:var(--sub);font-size:13px;font-weight:700'); root.appendChild(stats);
  const grid=d('display:grid;grid-template-columns:repeat(4,60px);gap:7px'); root.appendChild(grid);
  function draw(){
    stats.textContent=`Moves: ${moves} | Matched: ${cards.filter(c=>c.matched).length/2}/${EMOJIS.length}`;
    grid.innerHTML='';
    cards.forEach(c=>{
      const b=mk('button',{style:`width:60px;height:60px;border-radius:10px;font-size:24px;cursor:pointer;font-family:inherit;background:${c.matched?'var(--acc)33':'var(--card)'};border:1.5px solid ${c.matched?'var(--acc)':'var(--border)'}`});
      b.textContent=(c.flipped||c.matched)?c.val:'❓';
      b.onclick=()=>flip(c.id);
      grid.appendChild(b);
    });
  }
  function flip(id){
    if(locked) return;
    const c=cards.find(x=>x.id===id); if(c.flipped||c.matched) return;
    c.flipped=true; flippedIds.push(id); draw();
    if(flippedIds.length===2){
      moves++; locked=true;
      const[a,b]=flippedIds.map(i=>cards.find(x=>x.id===i));
      if(a.val===b.val){ a.matched=b.matched=true; flippedIds=[]; locked=false; draw(); }
      else setTimeout(()=>{ a.flipped=b.flipped=false; flippedIds=[]; locked=false; draw(); },700);
    }
  }
  draw();
}
function initSnL(root){
  const LADDERS={2:23,8:30,20:41,28:76,50:69,62:81,71:91}, SNAKES={17:4,54:31,62:19,64:60,87:24,93:68,95:75,98:78};
  let numPlayers=2, players=[], turn=0, dice=1, winner=null, started=false;
  const PCOLS=['#ff5252','#22d3ee','#ffd43b','#00d68f'];
  function setup(n){ numPlayers=n; players=Array.from({length:n},()=>({pos:0})); turn=0; winner=null; started=true; draw(); }
  function rollDice(){
    if(winner!==null) return;
    dice=1+Math.floor(Math.random()*6);
    const p=players[turn]; let np=p.pos+dice;
    if(np<=100){ if(LADDERS[np]) np=LADDERS[np]; else if(SNAKES[np]) np=SNAKES[np]; p.pos=np; }
    if(p.pos===100) winner=turn;
    else if(dice!==6) turn=(turn+1)%numPlayers;
    draw();
  }
  function cellNum(r,c){ const row=9-r; const l2r=row%2===0; return row*10+(l2r?c+1:10-c); }
  function draw(){
    root.innerHTML='';
    if(!started){
      const pick=d('text-align:center');
      pick.innerHTML='<div style="font-weight:700;color:var(--text);margin-bottom:14px">Kitne players?</div>';
      const row=d('display:flex;gap:8px;justify-content:center');
      [2,3,4].forEach(n=>{ const b=mk('button',{class:'btn btn-acc',style:'width:56px'}); b.textContent=n; b.onclick=()=>setup(n); row.appendChild(b); });
      pick.appendChild(row); root.appendChild(pick); return;
    }
    const boardWrap=d('display:grid;grid-template-columns:repeat(10,27px);grid-template-rows:repeat(10,27px);gap:1px;background:var(--border);border-radius:8px;overflow:hidden');
    for(let r=0;r<10;r++)for(let c=0;c<10;c++){
      const num=cellNum(r,c);
      const cell=d(`background:${LADDERS[num]?'#00d68f55':SNAKES[num]?'#ff525255':((r+c)%2===0?'var(--card)':'var(--card2)')};display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--sub);position:relative`);
      cell.textContent=num;
      const here=players.map((p,i)=>p.pos===num?i:null).filter(i=>i!==null);
      if(here.length) cell.innerHTML+=`<div style="position:absolute;bottom:1px;display:flex;gap:1px">${here.map(i=>`<div style="width:6px;height:6px;border-radius:50%;background:${PCOLS[i]}"></div>`).join('')}</div>`;
      boardWrap.appendChild(cell);
    }
    root.appendChild(boardWrap);
    const status=d('margin-top:14px;text-align:center');
    status.innerHTML=winner!==null?`<div style="font-weight:800;color:${PCOLS[winner]};font-size:15px">🎉 Player ${winner+1} jeet gaya!</div>`:`<div style="font-weight:700;color:var(--text)">Player ${turn+1} ki baari <span style="color:${PCOLS[turn]}">●</span></div>`;
    root.appendChild(status);
    const rollBtn=mk('button',{class:'btn btn-acc',style:'margin-top:10px;max-width:160px'});
    rollBtn.textContent=winner!==null?'🔄 Naya Game':`🎲 Roll (${dice})`;
    rollBtn.onclick=winner!==null?()=>{started=false;draw();}:rollDice;
    root.appendChild(rollBtn);
  }
  draw();
}
function initLudo(root){
  const PCOLS=['#ff5252','#22d3ee','#ffd43b','#00d68f'];
  const PNAMES=['Red','Cyan','Yellow','Green'];
  const SAFE=[0,8,13,21,26,34,39,47];
  const PATH_LEN=52;
  let numPlayers=2, players=[], turn=0, dice=1, winner=null, started=false, mustPick=false;

  function setup(n){
    numPlayers=n;
    players=Array.from({length:n},(_,i)=>({ offset:i*13, tokens:Array.from({length:4},()=>({state:'yard',steps:-1})) }));
    turn=0; winner=null; started=true; dice=1; mustPick=false; draw();
  }
  function absPos(p,steps){ return (steps+p.offset)%PATH_LEN; }
  function rollDice(){
    if(winner!==null||mustPick) return;
    dice=1+Math.floor(Math.random()*6);
    const p=players[turn];
    const canBringOut=dice===6&&p.tokens.some(t=>t.state==='yard');
    const movable=p.tokens.some(t=>t.state==='active'&&t.steps+dice<=56);
    if(!canBringOut&&!movable){
      toast('Koi move nahi, agla player');
      if(dice!==6) turn=(turn+1)%numPlayers;
      draw(); return;
    }
    mustPick=true; draw();
  }
  function afterMove(p){
    mustPick=false;
    if(p.tokens.every(t=>t.state==='finished')){ winner=turn; draw(); return; }
    if(dice!==6) turn=(turn+1)%numPlayers;
    draw();
  }
  function pickYardToken(){
    const p=players[turn]; const idx=p.tokens.findIndex(t=>t.state==='yard'); if(idx<0) return;
    p.tokens[idx]={state:'active',steps:0}; afterMove(p);
  }
  function pickActiveToken(i){
    const p=players[turn]; const t=p.tokens[i]; if(t.state!=='active'||t.steps+dice>56) return;
    t.steps+=dice;
    if(t.steps===56) t.state='finished';
    else if(t.steps<=50){
      const ap=absPos(p,t.steps);
      if(!SAFE.includes(ap)){
        players.forEach((op,oi)=>{ if(oi===turn) return; op.tokens.forEach(ot=>{ if(ot.state==='active'&&ot.steps<=50&&absPos(op,ot.steps)===ap){ ot.state='yard'; ot.steps=-1; toast(`${PNAMES[turn]} ne ${PNAMES[oi]} ko capture kiya! 🎯`); } }); });
      }
    }
    afterMove(p);
  }
  function draw(){
    root.innerHTML='';
    if(!started){
      const pick=d('text-align:center');
      pick.innerHTML='<div style="font-weight:700;color:var(--text);margin-bottom:14px">Kitne players?</div>';
      const row=d('display:flex;gap:8px;justify-content:center');
      [2,3,4].forEach(n=>{ const b=mk('button',{class:'btn btn-acc',style:'width:56px'}); b.textContent=n; b.onclick=()=>setup(n); row.appendChild(b); });
      pick.appendChild(row); root.appendChild(pick); return;
    }
    const yardsRow=d('display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;width:100%');
    players.forEach((p,i)=>{
      const yc=p.tokens.filter(t=>t.state==='yard').length, fc=p.tokens.filter(t=>t.state==='finished').length;
      const panel=d(`background:${PCOLS[i]}18;border:1.5px solid ${turn===i&&winner===null?PCOLS[i]:'transparent'};border-radius:10px;padding:6px 9px;font-size:10px;color:${PCOLS[i]};font-weight:700;text-align:center`);
      panel.innerHTML=`${PNAMES[i]}<br>🏠${yc} 🏆${fc}`;
      yardsRow.appendChild(panel);
    });
    root.appendChild(yardsRow);
    const track=d('display:flex;flex-wrap:wrap;width:273px;gap:2px;margin-bottom:14px;justify-content:center');
    for(let i=0;i<PATH_LEN;i++){
      const cell=d(`width:23px;height:23px;background:${SAFE.includes(i)?'#ffffff22':'var(--card2)'};border-radius:4px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px`);
      players.forEach((p,pi)=>p.tokens.forEach(t=>{ if(t.state==='active'&&t.steps<=50&&absPos(p,t.steps)===i) cell.innerHTML+=`<div style="width:9px;height:9px;border-radius:50%;background:${PCOLS[pi]};border:1px solid #fff"></div>`; }));
      track.appendChild(cell);
    }
    root.appendChild(track);
    const status=d('text-align:center;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text)');
    status.textContent=winner!==null?`🎉 ${PNAMES[winner]} jeet gaya!`:`${PNAMES[turn]} ki baari (6 se yard se niklega)`;
    root.appendChild(status);
    if(mustPick){
      const p=players[turn];
      const choiceRow=d('display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;max-width:280px');
      if(dice===6&&p.tokens.some(t=>t.state==='yard')){
        const b=mk('button',{class:'btn',style:`background:${PCOLS[turn]};max-width:150px;padding:9px 12px;font-size:12px`}); b.textContent='🔓 Yard se nikaalo';
        b.onclick=pickYardToken; choiceRow.appendChild(b);
      }
      p.tokens.forEach((t,i)=>{
        if(t.state==='active'&&t.steps+dice<=56){
          const b=mk('button',{class:'btn',style:`background:${PCOLS[turn]};max-width:120px;padding:9px 10px;font-size:11px`}); b.textContent=`Token ${i+1} (${t.steps+1}/57)`;
          b.onclick=()=>pickActiveToken(i); choiceRow.appendChild(b);
        }
      });
      root.appendChild(choiceRow);
    } else {
      const rollBtn=mk('button',{class:'btn btn-acc',style:'max-width:160px'});
      rollBtn.textContent=winner!==null?'🔄 Naya Game':`🎲 Roll (${dice})`;
      rollBtn.onclick=winner!==null?()=>{started=false;draw();}:rollDice;
      root.appendChild(rollBtn);
    }
  }
  draw();
}

    const b=mk('button',{class:'ad-tab',id:`adt-${t.id}`});
    b.innerHTML=`<span class="tic">${t.ic}</span><span class="tl">${t.l}</span>`;
    b.style.background=S.adTab===t.id?`${t.col}20`:'transparent';
    b.style.border=S.adTab===t.id?`1px solid ${t.col}40`:'1px solid transparent';
    b.querySelector('.tl').style.color=S.adTab===t.id?t.col:'rgba(255,255,255,.3)';
    if(S.adTab===t.id) b.querySelector('.tl').style.fontWeight='800';
    b.onclick=()=>{ S.adTab=t.id; S.adForm=null; S.adEditId=null; rebuildAdBody(); updateAdTabs(); };
    sb.appendChild(b);
  });
  // Spacer + logout
  sb.appendChild(d('flex:1'));
  const lg=mk('button',{class:'ad-tab',style:'background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.2);margin-bottom:8px'});
  lg.innerHTML=`<span class="tic">🚪</span><span class="tl" style="color:#ff5252;font-weight:600">Logout</span>`;
  lg.onclick=()=>{ showConfirmModal('Admin se logout?',()=>go({view:'main',nav:'home'}),'Logout'); };
  sb.appendChild(lg);
  layout.appendChild(sb);

  // Content
  const ca=mk('div',{class:'ad-content'});
  const ab=mk('div',{class:'ad-body',id:'ad-body'});
  adRender(ab);
  ca.appendChild(ab);
  layout.appendChild(ca);

  return w;
}

function updateAdTabs(){
  AD_TABS.forEach(t=>{
    const b=document.getElementById(`adt-${t.id}`); if(!b) return;
    const on=S.adTab===t.id;
    b.style.background=on?`${t.col}20`:'transparent';
    b.style.border=on?`1px solid ${t.col}40`:'1px solid transparent';
    const lbl=b.querySelector('.tl');
    if(lbl){ lbl.style.color=on?t.col:'rgba(255,255,255,.3)'; lbl.style.fontWeight=on?'800':'600'; }
  });
}

function rebuildAdBody(){
  const old=document.getElementById('ad-body'); if(!old) return;
  const nb=mk('div',{class:'ad-body',id:'ad-body'});
  adRender(nb); old.replaceWith(nb);
  const ca=document.querySelector('.ad-content'); if(ca) ca.scrollTop=0;
}

function adRender(body){
  switch(S.adTab){
    case 'dashboard': body.appendChild(adDash()); break;
    case 'subjects':  body.appendChild(adSubjects()); break;
    case 'content':   body.appendChild(adContent()); break;
    case 'add':       body.appendChild(adAddForm()); break;
    case 'chapters':  body.appendChild(adChapters()); break;
    case 'newsmgr':   body.appendChild(adNewsMgr()); break;
    case 'notifmgr':  body.appendChild(adNotifMgr()); break;
    case 'successmgr':body.appendChild(adSuccessMgr()); break;
    case 'chatmgr':   body.appendChild(adChatMgr()); break;
    case 'tubemgr':   body.appendChild(adTubeMgr()); break;
    case 'analytics': body.appendChild(adAnalytics()); break;
    case 'students':  body.appendChild(adStudents()); break;
    case 'settings':  body.appendChild(adSettings()); break;
  }
}

  const todayAdded=MATS.filter(m=>m.date===today).length;

  const qg=mk('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:8px'});

    b.onclick=()=>{ S.adTab=tab; S.adForm=null; rebuildAdBody(); updateAdTabs(); };
    qg.appendChild(b);
  });
  qa.appendChild(qg);w.appendChild(qa);

  // Content by type
  if(total>0){
    const ctitle=d('margin-bottom:8px');ctitle.innerHTML='<div style="font-weight:800;font-size:13px;color:var(--text);margin-bottom:9px">📋 Content by Type</div>';
    w.appendChild(ctitle);
    const ct=mk('div',{class:'card'});
    Object.entries(TYPE_INFO).forEach(([type,info])=>{
      const n=byType[type]||0; if(!n) return;

      row.innerHTML=`<span style="font-size:13px;width:55px;color:var(--text);font-weight:600;flex-shrink:0">${info.icon} ${info.label.length>5?info.label.slice(0,5):info.label}</span><div class="prog" style="flex:1"><div style="width:${pct}%;background:${info.color}"></div></div><span style="font-size:12px;color:${info.color};font-weight:700;width:20px;text-align:right">${n}</span>`;

    const rt=d('margin-top:16px');rt.innerHTML='<div style="font-weight:800;font-size:13px;color:var(--text);margin-bottom:9px">🕒 Recent Uploads</div>';

  const at=d('margin-top:16px');

      al.appendChild(row);
    });

  return w;
}

function adSubjects(){
  const w=mk('div');
  w.innerHTML='<div style="font-weight:900;font-size:15px;color:var(--text);margin-bottom:14px">📖 Subject Manager</div>';

  ['9','10'].forEach(cls=>{
    const sec=mk('div',{style:'background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px'});
    const subs=SUBJECTS_DATA[cls]||[];

    const title=mk('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px'});
    title.innerHTML=`<div style="font-weight:800;font-size:14px;color:var(--text)">Class ${cls} <span style="color:var(--sub);font-weight:600;font-size:12px">(${subs.length} subjects)</span></div>`;
    sec.appendChild(title);

    // Current subjects as chips
    const chips=mk('div',{style:'display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px'});
    subs.forEach((subj,i)=>{
      const chip=mk('div',{style:'display:flex;align-items:center;gap:5px;background:var(--acc)18;border:1px solid var(--acc)33;border-radius:20px;padding:5px 12px'});
      chip.innerHTML=`<span style="font-size:12px;font-weight:700;color:var(--acc)">${subj}</span>`;
      const del=mk('button',{style:'background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;line-height:1;padding:0'});del.textContent='×';
      del.onclick=()=>{
        showConfirmModal(`"${subj}" delete karein? Is subject ke sab materials bhi hatenge.`,()=>{
          SUBJECTS_DATA[cls]=SUBJECTS_DATA[cls].filter(s=>s!==subj);
          MATS=MATS.filter(m=>!(m.cls===cls&&m.subject===subj));
          save('ea_subjects',SUBJECTS_DATA); svMats();
          rebuildAdBody(); toast(`${subj} delete ho gaya!`);
        },'Delete');
      };
      chip.appendChild(del); chips.appendChild(chip);
    });
    sec.appendChild(chips);

    // Add new subject
    const addRow=mk('div',{style:'display:flex;gap:7px'});
    const si=mk('input',{class:'inp',style:'flex:1;padding:9px 12px;font-size:13px',placeholder:`Naya subject naam (Class ${cls})...`});
    const addBtn=mk('button',{class:'btn btn-green btn-sm',style:'white-space:nowrap'});addBtn.textContent='＋ Add';
    addBtn.onclick=()=>{
      const v=si.value.trim();
      if(!v){toast('Subject naam daalo!','err');return;}
      if((SUBJECTS_DATA[cls]||[]).includes(v)){toast('Yeh subject already hai!','warn');return;}
      if(!SUBJECTS_DATA[cls])SUBJECTS_DATA[cls]=[];
      SUBJECTS_DATA[cls].push(v);
      save('ea_subjects',SUBJECTS_DATA);
      si.value=''; rebuildAdBody(); toast(`${v} Class ${cls} mein add ho gaya!`);
    };
    si.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();});
    addRow.append(si,addBtn); sec.appendChild(addRow);
    w.appendChild(sec);
  });
  return w;
}

        <div style="font-weight:700;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">${m.title}</div>
        <div style="font-size:11px;color:var(--sub);margin-bottom:5px">${m.chapter||'No chapter'} • ${fdate(m.date)}</div>

        </div>

      <button onclick="adEditMat('${m.id}')" style="flex:1;padding:9px;background:transparent;border:none;color:var(--acc);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border-right:1px solid var(--border)">✏️ Edit</button>

// ─── CHAPTERS MANAGER ────────────────────────────────────
function adChapters(){
  const w=mk('div');

  const tr=mk('div',{style:'display:flex;gap:8px;margin-bottom:12px'});
  tr.innerHTML='<div style="font-weight:900;font-size:15px;color:var(--text);width:100%;margin-bottom:4px">📑 Chapter Manager</div>';
  const clsel=mk('select',{class:'inp',style:'padding:9px 10px;font-size:12px;flex:1'});
  ['9','10'].forEach(c=>{const o=mk('option');o.value=c;o.textContent='Class '+c;if(c===S.adChCls)o.selected=true;clsel.appendChild(o);});
  clsel.onchange=e=>{S.adChCls=e.target.value;refreshSjOpts2();renderChapters();};
  const sjsel=mk('select',{class:'inp',style:'padding:9px 10px;font-size:12px;flex:1'});
  function refreshSjOpts2(){sjsel.innerHTML='';(SUBJECTS[S.adChCls]||[]).forEach(s=>{const o=mk('option');o.value=s;o.textContent=s;if(s===S.adChSubj)o.selected=true;sjsel.appendChild(o);});}
  sjsel.onchange=e=>{S.adChSubj=e.target.value;renderChapters();};
  refreshSjOpts2(); tr.append(clsel,sjsel); w.appendChild(tr);

  const cw=mk('div',{id:'ch-wrap'});w.appendChild(cw);

  function renderChapters(){
    cw.innerHTML='';
    const key=`${S.adChCls}_${S.adChSubj}`;
    if(!CHAPTERS[key]) CHAPTERS[key]=[];
    const chs=CHAPTERS[key];

    const info=d('margin-bottom:10px');info.innerHTML=`<span style="font-size:12px;color:var(--sub)">${chs.length} chapters • Class ${S.adChCls} ${S.adChSubj}</span>`;
    cw.appendChild(info);

    const ar=mk('div',{style:'display:flex;gap:8px;margin-bottom:12px'});
    const ci=mk('input',{class:'inp',style:'flex:1;padding:10px 12px;font-size:13px',placeholder:'Naya chapter naam...'});
    const ab=mk('button',{class:'btn btn-green btn-sm',style:'white-space:nowrap;flex-shrink:0'});ab.textContent='＋ Add';
    ab.onclick=()=>{
      const v=ci.value.trim();
      if(!v){toast('Chapter naam daalo!','err');return;}
      if(chs.includes(v)){toast('Yeh chapter already hai!','warn');return;}
      chs.push(v); ci.value=''; svChapters(); renderChapters(); toast('Chapter add ho gaya!');
    };
    ci.addEventListener('keydown',e=>{if(e.key==='Enter')ab.click();});
    ar.append(ci,ab); cw.appendChild(ar);

    if(chs.length===0){
      const e=d('text-align:center;padding:24px;background:var(--card2);border-radius:12px;border:1px dashed var(--border);color:var(--sub)');
      e.innerHTML='<div style="font-size:32px">📑</div><div style="margin-top:6px;font-size:12px">Koi chapter nahi. Add karein!</div>';
      cw.appendChild(e); return;
    }

    const ll=d('display:flex;flex-direction:column;gap:7px');
    chs.forEach((ch,i)=>{
      const mats=getMats({cls:S.adChCls,subj:S.adChSubj,chapter:ch});
      const row=mk('div',{style:'background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:9px'});
      row.innerHTML=`<div style="width:28px;height:28px;border-radius:8px;background:var(--acc)20;display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:800;font-size:11px;flex-shrink:0">${i+1}</div>
      <div style="flex:1;overflow:hidden"><div style="font-weight:600;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ch}</div>
      <div style="font-size:10px;color:var(--sub)">${mats.length} materials</div></div>`;
      // Move up/down
      if(i>0){const up=mk('button',{style:'background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px;font-family:inherit;color:var(--text)'});up.textContent='↑';up.onclick=()=>{[chs[i],chs[i-1]]=[chs[i-1],chs[i]];svChapters();renderChapters();};row.appendChild(up);}
      if(i<chs.length-1){const dn=mk('button',{style:'background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px;font-family:inherit;color:var(--text)'});dn.textContent='↓';dn.onclick=()=>{[chs[i],chs[i+1]]=[chs[i+1],chs[i]];svChapters();renderChapters();};row.appendChild(dn);}
      const del=mk('button',{style:'background:var(--red)15;border:none;color:var(--red);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit'});del.textContent='✕';
      del.onclick=()=>{showConfirmModal(`"${ch}" delete karein?`,()=>{chs.splice(i,1);svChapters();renderChapters();toast('Chapter delete ho gaya!');},'Delete');};
      row.appendChild(del); ll.appendChild(row);
    });
    cw.appendChild(ll);
  }
  renderChapters();
  return w;
}


// ─── NOTIFICATION MANAGER ────────────────────────────────
function adNotifMgr(){
  const w=mk('div');
  let notifs=load('ea_notifs',[]);

  function draw(){
    w.innerHTML='<div style="font-weight:900;font-size:15px;color:var(--text);margin-bottom:14px">🔔 Notification Manager</div>';

    // Send new notification
    const sendCard=mk('div',{class:'card',style:'margin-bottom:14px'});
    sendCard.innerHTML=`
    <div style="font-weight:800;font-size:13px;color:var(--text);margin-bottom:12px">📢 Naya Notification Bhejo</div>
    <div style="margin-bottom:9px"><label style="font-size:11px;color:var(--sub);display:block;margin-bottom:4px;font-weight:700">Icon (emoji)</label>

      <input id="ni-title" class="inp" placeholder="e.g. New Chapter Added!"></div>

      <textarea id="ni-body" class="inp" rows="2" placeholder="Notification ka content..."></textarea></div>`;
    const sendBtn=mk('button',{class:'btn btn-acc'});sendBtn.textContent='📢 Notification Send Karo';
    sendBtn.onclick=()=>{
      const title=document.getElementById('ni-title')?.value?.trim();
      if(!title){toast('Title zaroori hai!','err');return;}
      const notif={
        id:'n'+Date.now(), title,
        body:document.getElementById('ni-body')?.value?.trim()||'',
        icon:document.getElementById('ni-icon')?.value?.trim()||'📢',
        date:new Date().toISOString().split('T')[0], read:false
      };
      notifs=[notif,...notifs];
      save('ea_notifs',notifs);
      document.getElementById('ni-title').value='';
      document.getElementById('ni-body').value='';
      draw(); toast('Notification send ho gayi! 🔔');
    };
    sendCard.appendChild(sendBtn);
    w.appendChild(sendCard);

    // Sent notifications list
    const lst=mk('div',{style:'font-weight:800;font-size:13px;color:var(--text);margin-bottom:10px'});
    lst.textContent=`📋 Sent Notifications (${notifs.length})`;
    w.appendChild(lst);

    if(notifs.length===0){
      const e=d('text-align:center;padding:30px;background:var(--card2);border-radius:14px;border:1px dashed var(--border);color:var(--sub)');
      e.innerHTML='<div style="font-size:36px">🔔</div><div style="margin-top:7px;font-size:12px">Abhi koi notification nahi</div>';
      w.appendChild(e);
    } else {
      notifs.forEach((n,i)=>{
        const row=mk('div',{style:'background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px'});
        row.innerHTML=`<div style="font-size:22px;flex-shrink:0">${n.icon||'📢'}</div>
        <div style="flex:1;overflow:hidden">
          <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:2px">${n.title}</div>
          ${n.body?`<div style="font-size:12px;color:var(--sub);margin-bottom:3px">${n.body}</div>`:''}
          <div style="font-size:10px;color:var(--sub)">${fdate(n.date)} • ${load('ea_notifs',[]).find(x=>x.id===n.id)?.read?'Read ✓':'Unread'}</div>
        </div>`;
        const del=mk('button',{style:'background:var(--red)18;border:none;color:var(--red);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;flex-shrink:0'});del.textContent='🗑️';
        del.onclick=()=>{notifs.splice(i,1);save('ea_notifs',notifs);draw();toast('Delete ho gaya!');};
        row.appendChild(del); w.appendChild(row);
      });
    }
  }
  draw();
  return w;
}

    bs.appendChild(row);
  });

  // By class
  const bct=d('margin-bottom:8px');bct.innerHTML='<div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:9px">🎓 By Class</div>';
  w.appendChild(bct);

    bc.appendChild(c);
  });

  return w;
}

function openStudentAccessModal(studentId){
  const stu=STUDENTS.find(s=>s.id===studentId); if(!stu) return;
  if(!stu.blockedFeatures) stu.blockedFeatures=[];
  const FEATS=[['chat','💬 Chat'],['mytube','📺 MyTube'],['success','🏆 Success'],['funzone','🎮 Fun Zone'],['community','🌐 Community'],['leaderboard','📊 Leaderboard']];
  const ov=mk('div',{class:'ov',style:'display:flex;align-items:flex-end;justify-content:center'});
  const card=mk('div',{style:'background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:430px'});
  card.innerHTML=`<div style="font-weight:800;font-size:15px;color:var(--text);margin-bottom:4px">🔒 ${escapeHtml(stu.name)} ke liye Access</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:14px">Jo band karoge, sirf isी student ke liye band hoga</div>
    <div id="sam-list"></div>
    <button id="sam-save" class="btn btn-acc" style="margin-top:10px">Save Karo</button>`;
  ov.appendChild(card); document.getElementById('root').appendChild(ov);
  const list=card.querySelector('#sam-list');
  FEATS.forEach(([key,label])=>{
    const blocked=stu.blockedFeatures.includes(key);
    const row=mk('div',{style:'display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:8px'});
    row.innerHTML=`<span style="font-size:13px;font-weight:700;color:var(--text)">${label}</span>
    <button class="sam-toggle" data-key="${key}" style="width:44px;height:26px;border-radius:20px;border:none;cursor:pointer;background:${blocked?'var(--border)':'#00d68f'};position:relative">
      <span style="position:absolute;top:3px;left:${blocked?'3px':'22px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s"></span>
    </button>`;
    list.appendChild(row);
  });
  list.querySelectorAll('.sam-toggle').forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.key;
      const i=stu.blockedFeatures.indexOf(k);
      const nowBlocked = i<0;
      if(i>=0) stu.blockedFeatures.splice(i,1); else stu.blockedFeatures.push(k);
      btn.style.background=nowBlocked?'var(--border)':'#00d68f';
      btn.querySelector('span').style.left=nowBlocked?'3px':'22px';
    };
  });
  card.querySelector('#sam-save').onclick=()=>{ svStudents(); ov.remove(); toast('Access update ho gaya! ✅'); };
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
}
